<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <div class="container header-content">
            <a href="#" class="logo">Flipkart</a>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search for products...">
                <button id="search-button"><i class="fas fa-search"></i></button>
            </div>
            <div class="header-icons">
                <button id="cart-icon" class="icon-button">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count" class="cart-count">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container main-content">
        <section class="product-listing">
            <div id="product-container" class="product-grid"></div>
            <div id="pagination-container" class="pagination"></div>
        </section>
    </main>

    <div id="cart-sidebar" class="cart-sidebar hidden">
        <div class="cart-header">
            <h2>Shopping Cart</h2>
            <button id="close-cart-sidebar" class="close-button">&times;</button>
        </div>
        <div id="cart-items" class="cart-items"></div>
        <div class="cart-summary">
            <div class="cart-total">Total: <span id="cart-total-amount">₹0.00</span></div>
            <button id="checkout-button" class="checkout-button">Proceed to Checkout</button>
        </div>
    </div>

    <div id="product-detail-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-product-detail-modal" class="close-button">&times;</button>
            <div class="modal-product-image-wrapper">
                <img id="modal-product-image" src="" alt="" class="modal-product-image">
            </div>
            <h3 id="modal-product-name" class="modal-product-name"></h3>
            <p id="modal-product-price" class="modal-product-price"></p>
            <p id="modal-product-description" class="modal-product-description"></p>
            <button id="modal-add-to-cart" class="add-to-cart-button">Add to Cart</button>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
