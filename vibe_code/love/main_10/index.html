<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnSphere - Your Learning Platform</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id="navbar"></header>

    <main id="content">
        <section id="home" class="page">
            <h1>Welcome to LearnSphere</h1>
            <p>Unlock your potential with our comprehensive courses.</p>
            <button id="get-started">Get Started</button>
        </section>

        <section id="courses" class="page">
            <h2>Our Courses</h2>
            <div id="course-list"></div>
        </section>

        <section id="contact" class="page">
            <h2>Contact Us</h2>
            <form id="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
                <button type="submit">Submit</button>
            </form>
        </section>

        <section id="login" class="page">
            <h2>Login</h2>
            <form id="login-form">
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" name="email" required>
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" name="password" required>
                <button type="submit">Login</button>
            </form>
        </section>

        <section id="signup" class="page">
            <h2>Sign Up</h2>
            <form id="signup-form">
                <label for="signup-name">Name:</label>
                <input type="text" id="signup-name" name="name" required>
                <label for="signup-email">Email:</label>
                <input type="email" id="signup-email" name="email" required>
                <label for="signup-password">Password:</label>
                <input type="password" id="signup-password" name="password" required>
                <button type="submit">Sign Up</button>
            </form>
        </section>

        <section id="cart" class="page">
            <h2>Shopping Cart</h2>
            <div id="cart-items"></div>
            <p>Total: $<span id="cart-total">0.00</span></p>
            <button id="checkout">Checkout</button>
        </section>
    </main>

    <footer id="footer"></footer>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <p id="modal-message"></p>
        </div>
    </div>

    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="components/modal.js"></script>
    <script src="components/dropdown.js"></script>
    <script src="components/carousel.js"></script>
    <script src="script.js"></script>
</body>
</html>
