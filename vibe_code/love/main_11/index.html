<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash of Clans - Official Website</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
</head>
<body>
    <header class="main-header">
        <nav class="navbar" id="main-navbar">
            <div class="navbar-brand">Clash of Clans</div>
            <button class="hamburger-menu" aria-label="Toggle navigation">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <ul class="nav-links">
                <li><a href="#/" class="nav-link" data-route="home">Home</a></li>
                <li><a href="#/heroes" class="nav-link" data-route="heroes">Heroes</a></li>
                <li><a href="#/troops" class="nav-link" data-route="troops">Troops</a></li>
                <li><a href="#/buildings" class="nav-link" data-route="buildings">Buildings</a></li>
                <li><a href="#/news" class="nav-link" data-route="news">News</a></li>
                <li class="dropdown">
                    <a href="#/shop" class="nav-link dropdown-toggle" data-route="shop">Shop</a>
                    <div class="dropdown-menu" id="shop-dropdown">
                        <!-- Shop categories will be dynamically loaded here -->
                    </div>
                </li>
                <li><a href="#/contact" class="nav-link" data-route="contact">Contact</a></li>
                <li class="nav-auth">
                    <button class="btn btn-secondary" id="login-btn">Login</button>
                    <button class="btn btn-primary" id="signup-btn">Sign Up</button>
                </li>
                <li class="nav-cart">
                    <button class="btn btn-icon" id="cart-btn" aria-label="Shopping Cart">
                        🛒 <span id="cart-count" class="cart-count">0</span>
                    </button>
                </li>
            </ul>
        </nav>
    </header>

    <main id="app-content" class="app-content">
        <!-- Content will be dynamically loaded here -->
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2023 Clash of Clans. All rights reserved. Not affiliated with Supercell.</p>
            <div class="social-links">
                <a href="#" aria-label="Facebook">Facebook</a>
                <a href="#" aria-label="Twitter">Twitter</a>
                <a href="#" aria-label="YouTube">YouTube</a>
            </div>
        </div>
    </footer>

    <!-- Modals -->
    <div id="login-modal" class="modal" aria-modal="true" role="dialog" aria-labelledby="login-modal-title">
        <div class="modal-content">
            <span class="close-button" aria-label="Close login form">&times;</span>
            <h2 id="login-modal-title">Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-username">Username:</label>
                    <input type="text" id="login-username" name="username" required aria-required="true">
                    <div class="error-message" id="login-username-error"></div>
                </div>
                <div class="form-group">
                    <label for="login-password">Password:</label>
                    <input type="password" id="login-password" name="password" required aria-required="true">
                    <div class="error-message" id="login-password-error"></div>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>
    </div>

    <div id="signup-modal" class="modal" aria-modal="true" role="dialog" aria-labelledby="signup-modal-title">
        <div class="modal-content">
            <span class="close-button" aria-label="Close signup form">&times;</span>
            <h2 id="signup-modal-title">Sign Up</h2>
            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-username">Username:</label>
                    <input type="text" id="signup-username" name="username" required aria-required="true">
                    <div class="error-message" id="signup-username-error"></div>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email:</label>
                    <input type="email" id="signup-email" name="email" required aria-required="true">
                    <div class="error-message" id="signup-email-error"></div>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password:</label>
                    <input type="password" id="signup-password" name="password" required aria-required="true">
                    <div class="error-message" id="signup-password-error"></div>
                </div>
                <div class="form-group">
                    <label for="signup-confirm-password">Confirm Password:</label>
                    <input type="password" id="signup-confirm-password" name="confirmPassword" required aria-required="true">
                    <div class="error-message" id="signup-confirm-password-error"></div>
                </div>
                <button type="submit" class="btn btn-primary">Sign Up</button>
            </form>
        </div>
    </div>

    <div id="cart-modal" class="modal" aria-modal="true" role="dialog" aria-labelledby="cart-modal-title">
        <div class="modal-content">
            <span class="close-button" aria-label="Close cart">&times;</span>
            <h2 id="cart-modal-title">Your Cart</h2>
            <div id="cart-items"></div>
            <div class="cart-summary">
                <p>Total: <span id="cart-total">$0.00</span></p>
                <button class="btn btn-primary" id="checkout-btn">Checkout</button>
            </div>
            <div id="cart-empty-message" class="empty-message" style="display: none;">Your cart is empty.</div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
