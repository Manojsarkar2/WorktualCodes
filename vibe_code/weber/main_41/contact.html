<section class="container">
    <h1>Contact Us</h1>
    <p>Have questions about Clash of Clans, suggestions for our fan site, or just want to say hello? Fill out the form below and we'll get back to you!</p>

    <div class="contact-form-container">
        <form id="contact-form" class="modal-content">
            <div class="form-group">
                <label for="contact-name">Your Name:</label>
                <input type="text" id="contact-name" name="name" required aria-required="true">
                <span class="error-message" id="contact-name-error"></span>
            </div>
            <div class="form-group">
                <label for="contact-email">Your Email:</label>
                <input type="email" id="contact-email" name="email" required aria-required="true">
                <span class="error-message" id="contact-email-error"></span>
            </div>
            <div class="form-group">
                <label for="contact-message">Message:</label>
                <textarea id="contact-message" name="message" rows="6" required aria-required="true"></textarea>
                <span class="error-message" id="contact-message-error"></span>
            </div>
            <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
    </div>

    <div style="text-align: center; margin-top: 3em;">
        <h2>Find Us On Social Media</h2>
        <div class="social-links">
            <a href="#" aria-label="Facebook"><span role="img" aria-label="Facebook icon">📘</span></a>
            <a href="#" aria-label="Twitter"><span role="img" aria-label="Twitter icon">🐦</span></a>
            <a href="#" aria-label="Instagram"><span role="img" aria-label="Instagram icon">📸</span></a>
        </div>
        <p style="margin-top: 1em;">We're always happy to connect with fellow Clashers!</p>
    </div>
</section>
